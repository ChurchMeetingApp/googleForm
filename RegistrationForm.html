<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KA Blending in Hubli Aug 8th to 9th Registration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            color: #111;
            font-size: 24px;
            text-align: center;
            line-height: 1.3;
        }
        h2 {
            margin-top: 5px;
            color: #666;
            font-size: 16px;
            text-align: center;
            font-weight: normal;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"], input[type="number"], input[type="datetime-local"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }
        .checkbox-group label {
            display: inline;
            margin: 0;
            cursor: pointer;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .conditional-field {
            display: none;
            background-color: #f8f9fa;
            padding: 12px;
            border-left: 4px solid #007bff;
            border-radius: 0 4px 4px 0;
            margin-top: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #responseMessage {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>KA Blending in Hubli</h1>
    <h2>Aug 8th to 9th Registration</h2>
    
    <form id="registrationForm">
        
        <!-- 1. Name -->
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" required placeholder="Enter full name">
        </div>

        <!-- 2. Locality -->
        <div class="form-group">
            <label for="locality">Locality:</label>
            <select id="locality" required>
                <option value="" disabled selected>Select Locality</option>
                <option value="Bangalore">Bangalore</option>
                <option value="KGF">KGF</option>
                <option value="Hubli">Hubli</option>
                <option value="Belgaum">Belgaum</option>
                <option value="Bidar">Bidar</option>
                <option value="Nayakanahatti">Nayakanahatti</option>
                <option value="Chitradurga">Chitradurga</option>
                <option value="Mysore">Mysore</option>
            </select>
        </div>

        <!-- 3. Age -->
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" required min="0" max="120" placeholder="Enter age">
        </div>

        <!-- 4. Br/Sis -->
        <div class="form-group">
            <label for="brSis">Brother / Sister:</label>
            <select id="brSis" required>
                <option value="" disabled selected>Select option</option>
                <option value="Brother">Brother</option>
                <option value="Sister">Sister</option>
            </select>
        </div>

        <!-- 5. Adult/Children -->
        <div class="form-group">
            <label>Attendee Type:</label>
            <div class="radio-group">
                <label><input type="radio" name="attendeeType" value="Adult" checked> Adult</label>
                <label><input type="radio" name="attendeeType" value="Child"> Children</label>
            </div>
        </div>

        <!-- 5b. Needs Accommodation Wrapper (Visible for Adults) -->
        <div class="form-group checkbox-group" id="accommodationWrapper">
            <input type="checkbox" id="needsAccommodation">
            <label for="needsAccommodation">I require accommodation facilities</label>
        </div>

        <!-- 5c. Needs Separate Bed Wrapper (Visible for Children) -->
        <div id="separateBedContainer" class="conditional-field">
            <div class="checkbox-group">
                <input type="checkbox" id="needsSeparateBed">
                <label for="needsSeparateBed">I require a separate bed</label>
            </div>
        </div>

        <!-- 6. Language -->
        <div class="form-group">
            <label for="language">Language Preference:</label>
            <select id="language" required>
                <option value="" disabled selected>Select Language</option>
                <option value="English">English</option>
                <option value="Kannada">Kannada</option>
            </select>
        </div>

        <!-- 7. Date & Time of Arrival -->
        <div class="form-group">
            <label for="arrivalDateTime">Date & Time of Arrival:</label>
            <input type="datetime-local" id="arrivalDateTime" required>
        </div>

        <!-- 8. Date & Time of Departure -->
        <div class="form-group">
            <label for="departureDateTime">Date & Time of Departure:</label>
            <input type="datetime-local" id="departureDateTime" required>
        </div>

        <!-- 9. Place of Arrival -->
        <div class="form-group">
            <label for="arrivalPlace">Place of Arrival:</label>
            <select id="arrivalPlace" required>
                <option value="" disabled selected>Select Place</option>
                <option value="Hubli">Hubli</option>
                <option value="Dharwad">Dharwad</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">Submit Registration</button>
    </form>

    <div id="responseMessage"></div>
</div>

<script>
    // Your active Google Apps Script web app endpoint link
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbze2WwlgtjrhmwxPXH-0OpTN1utwzgHnytN_r9oJ90DPmfnE_raYI3Wb8bCvTZEv6wP/exec';

    const accommodationWrapper = document.getElementById('accommodationWrapper');
    const accommodationCheckbox = document.getElementById('needsAccommodation');
    const separateBedContainer = document.getElementById('separateBedContainer');
    const separateBedCheckbox = document.getElementById('needsSeparateBed');
    const attendeeRadioButtons = document.getElementsByName('attendeeType');

    // Manages form presentation states according to standard attendee configurations
    function handleFormLogic() {
        const selectedAttendee = document.querySelector('input[name="attendeeType"]:checked').value;

        if (selectedAttendee === 'Child') {
            accommodationWrapper.style.display = 'none';
            separateBedContainer.style.display = 'block';
        } else {
            accommodationWrapper.style.display = 'flex';
            separateBedContainer.style.display = 'none';
        }
    }

    attendeeRadioButtons.forEach(radio => radio.addEventListener('change', handleFormLogic));

    // Initialize UI constraints right away
    handleFormLogic();

    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const responseMessage = document.getElementById('responseMessage');
        
        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting...';
        responseMessage.style.display = 'none';

        const selectedAttendee = document.querySelector('input[name="attendeeType"]:checked').value;
        
        let accommodationValue = 'No';
        let separateBedValue = 'No';

        if (selectedAttendee === 'Child') {
            accommodationValue = 'Yes';
            separateBedValue = separateBedCheckbox.checked ? 'Yes' : 'No';
        } else {
            accommodationValue = accommodationCheckbox.checked ? 'Yes' : 'No';
            separateBedValue = 'Yes';
        }

        // Assembled structured JavaScript payload mapping to script properties
        const payloadData = {
            name: document.getElementById('name').value,
            locality: document.getElementById('locality').value,
            age: document.getElementById('age').value,
            brSis: document.getElementById('brSis').value,
            attendeeType: selectedAttendee,
            language: document.getElementById('language').value,
            arrivalDateTime: document.getElementById('arrivalDateTime').value,
            departureDateTime: document.getElementById('departureDateTime').value,
            arrivalPlace: document.getElementById('arrivalPlace').value,
            needsAccommodation: accommodationValue,
            needsSeparateBed: separateBedValue
        };

        // Fire text/plain json layout string to clear 302 jumps without header degradation
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', 
            cache: 'no-cache',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payloadData)
        })
        .then(response => {
            responseMessage.style.display = 'block';
            responseMessage.style.backgroundColor = '#d4edda';
            responseMessage.style.color = '#155724';
            responseMessage.innerText = 'Registration successfully submitted!';
            
            document.getElementById('registrationForm').reset();
            handleFormLogic();
        })
        .catch(error => {
            console.error('Error:', error);
            responseMessage.style.display = 'block';
            responseMessage.style.backgroundColor = '#f8d7da';
            responseMessage.style.color = '#721c24';
            responseMessage.innerText = 'Something went wrong. Please try again.';
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Registration';
        });
    });
</script>

</body>
</html>
